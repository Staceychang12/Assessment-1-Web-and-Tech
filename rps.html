<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock, Paper, Scissors | Stacey Chang Wai Ling</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="header-container">
      <img src="https://via.placeholder.com/180x60?text=STACEY+CHANG" alt="Stacey Chang Portfolio Logo" class="logo" />
      <button class="menu-toggle" aria-label="Toggle navigation menu">☰</button>
      <nav>
        <ul id="navMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="basic webpage.html">Week 2: Basic Webpage</a></li>
          <li><a href="rps.html" class="active">Week 3: Rock Paper Scissors</a></li>
          <li><a href="flatland.html">Week 4: Flatland Business Advisor</a></li>
          <li><a href="rss.html">Week 5: RSS Reader</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h1>Rock, Paper or Scissors?</h1>
      <div>
        <span class="circle" onclick="play('rock')">R</span>
        <span class="circle" onclick="play('paper')">P</span>
        <span class="circle" onclick="play('scissors')">S</span>
      </div>

      <div id="result"></div>

      <a class="instruction" href="https://en.wikipedia.org/wiki/Rock%E2%80%93paper%E2%80%93scissors" target="_blank">
        RULES</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Stacey Chang Wai Ling | Portfolio</p>
  </footer>

  <button id="toTopBtn" aria-label="Back to top">↑</button>

  <script>
    // Mobile menu toggle
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.getElementById('navMenu');
    
    menuToggle.addEventListener('click', () => {
      navMenu.classList.toggle('show');
    });
    
    // Game logic
    function play(userChoice) {
      const choices = ['rock', 'paper', 'scissors'];
      const computerChoice = choices[Math.floor(Math.random() * 3)]; // Random choice
      const resultDiv = document.getElementById('result');
      let result = '';
      
      if (userChoice === computerChoice) {
        result = `Draw! We both chose ${userChoice}.`;
      } else if (
        (userChoice === 'rock' && computerChoice === 'scissors') ||
        (userChoice === 'paper' && computerChoice === 'rock') ||
        (userChoice === 'scissors' && computerChoice === 'paper')
      ) {
        result = `You win! ${userChoice} beats ${computerChoice}.`;
      } else {
        result = `You lose! ${computerChoice} beats ${userChoice}.`;
      }
      
      resultDiv.textContent = result;
      
      // Speech synthesis if available
      if (window.speechSynthesis) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(result);
        synth.speak(utter);
      }
    }
    
    // Back to top button functionality
    const toTopBtn = document.getElementById('toTopBtn');
    
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        toTopBtn.classList.add('visible');
      } else {
        toTopBtn.classList.remove('visible');
      }
    });
    
    toTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
    
    // Highlight active navigation item
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('nav a');
    
    navLinks.forEach(link => {
      const linkPage = link.getAttribute('href');
      if (linkPage === currentPage || (currentPage === '' && linkPage === 'index.html')) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  </script>
</body>
</html>
